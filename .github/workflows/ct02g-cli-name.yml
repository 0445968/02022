name: CT-02g migration filename (temporary)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate migration using pinned Supabase CLI
        run: |
          npx --yes supabase@3.2.0 migration --help
          npx --yes supabase@3.2.0 migration new ct02g_media_storage_security
          find supabase/migrations -maxdepth 1 -name '*_ct02g_media_storage_security.sql' -print
