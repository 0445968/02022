name: CT-03b temporary migration filename
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Supabase CLI 3.2.0 migration filename
        run: |
          npx --yes supabase@3.2.0 migration --help
          npx --yes supabase@3.2.0 migration new ct03b_staff_overrides
          find supabase/migrations -maxdepth 1 -name '*_ct03b_staff_overrides.sql' -print
