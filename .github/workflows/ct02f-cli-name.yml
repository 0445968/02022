name: CT-02f migration filename (temporary)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          npx --yes supabase@3.2.0 migration new ct02f_publisher_versions
          find supabase/migrations -maxdepth 1 -name '*_ct02f_publisher_versions.sql' -print
