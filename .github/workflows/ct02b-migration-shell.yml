name: CT-02b Generate Migration Filename
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate migration filename with pinned Supabase CLI (local only)
        run: |
          npx --yes supabase@3.2.0 migration new ct02b_staff_access
          find supabase/migrations -maxdepth 1 -name '*_ct02b_staff_access.sql' -print
