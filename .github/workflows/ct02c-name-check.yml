name: CT-02c migration name check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          npx --yes supabase@3.2.0 migration new ct02c_owner_guard_and_audit
          find supabase/migrations -maxdepth 1 -name '*_ct02c_owner_guard_and_audit.sql' -print
