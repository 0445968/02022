name: CT-15 approved Preview browser audit
on:
  workflow_dispatch:
    inputs:
      preview_origin:
        description: 'Exact approved isolated Vercel Preview HTTPS origin (not production)'
        required: true
        type: string
      approved_read_only:
        description: 'Type yes after verifying Preview database isolation'
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CT15_PREVIEW_ORIGIN: ${{ inputs.preview_origin }}
      CT15_APPROVED_READ_ONLY: ${{ inputs.approved_read_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned disposable browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/ct15-browser" --ignore-scripts --no-save playwright@1.56.1
          "$RUNNER_TEMP/ct15-browser/node_modules/.bin/playwright" install --with-deps chromium
          export CT15_PLAYWRIGHT_MODULE="$RUNNER_TEMP/ct15-browser/node_modules/playwright/index.mjs"
          node scripts/ct15-browser-audit.mjs
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ct15-public-preview-evidence
          path: ct15-browser-evidence/
          retention-days: 7
