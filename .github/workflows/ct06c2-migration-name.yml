name: CT-06c.2 migration filename
on: [pull_request]
permissions:
  contents: read
jobs:
  name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          npx --yes supabase@3.2.0 --version
          npx --yes supabase@3.2.0 migration new --help
          npx --yes supabase@3.2.0 migration new ct06c_reviewed_schedule
          ls supabase/migrations/*_ct06c_reviewed_schedule.sql
