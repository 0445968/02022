name: CT-02j migration filename temporary
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  generate-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate a valid migration name with Supabase CLI 3.2.0
        run: |
          npx --yes supabase@3.2.0 migration --help
          npx --yes supabase@3.2.0 migration new ct02j_media_promotion
          find supabase/migrations -maxdepth 1 -name '*_ct02j_media_promotion.sql' -print
