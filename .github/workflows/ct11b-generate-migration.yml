name: CT-11b generate migration filename
on:
  pull_request:
    paths:
      - '.github/workflows/ct11b-generate-migration.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate local migration filename using pinned CLI
        run: |
          npx --yes supabase@3.2.0 --version
          npx --yes supabase@3.2.0 migration new --help
          npx --yes supabase@3.2.0 migration new ct11b_homepage_history
          find supabase/migrations -name '*_ct11b_homepage_history.sql' -print
