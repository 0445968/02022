name: CT-02k temporary migration filename
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Supabase CLI generate filename
        run: |
          npx --yes supabase@3.2.0 migration --help
          npx --yes supabase@3.2.0 migration new ct02k_reader_comments_rls
          find supabase/migrations -maxdepth 1 -name '*_ct02k_reader_comments_rls.sql' -print
