name: CT-02h migration filename temporary
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cli-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate migration with pinned Supabase CLI
        run: |
          npx --yes supabase@3.2.0 migration --help
          npx --yes supabase@3.2.0 migration new ct02h_editorial_direct_policies
          find supabase/migrations -maxdepth 1 -name '*_ct02h_editorial_direct_policies.sql' -print
