name: CT-15 materialize exact reviewed upgrade (one shot)
on:
  pull_request:
    paths:
      - '.github/workflows/ct15-materialize-reviewed-upgrade.yml'
permissions: {}
jobs:
  materialize:
    if: github.repository == '0445968/02022' && github.event.pull_request.number == 56 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ct15-framework-rehearsal-2026-11-24'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Create reviewed Git objects without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 'ee2614105eef3768ea50e143551888bb40194ce8'
          PREP_SHA: ${{ github.event.pull_request.head.sha }}
          PATCH_SHA256: '1a715a79817854ed91437f322322f00675a0690d62ab3eb4fe2b6a4d0e659501'
          REHEARSAL_RUN: '45540986279'
          ARTIFACT_ID: '14988589342'
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, zipfile
          env=os.environ
          def cmd(*args):
              return subprocess.check_output(args)
          def api(path, payload=None):
              args=['gh','api','repos/0445968/02022/'+path]
              if payload is None:
                  return cmd(*args)
              return subprocess.run(args+['--method','POST','--input','-'],input=json.dumps(payload).encode(),check=True,stdout=subprocess.PIPE).stdout
          head=cmd('git','rev-parse','HEAD').decode().strip()
          assert head==env['PREP_SHA']
          assert cmd('git','rev-parse','HEAD^').decode().strip()==env['SOURCE_SHA']
          prep=set(cmd('git','diff','--name-only','HEAD^','HEAD').decode().splitlines())
          assert prep==set(["docs/clear-talks/CT15_FRAMEWORK_REHEARSAL.md","docs/clear-talks/IMPLEMENTATION_LEDGER.md","docs/clear-talks/NEXT_CHAT_HANDOFF.md",".github/workflows/ct15-framework-rehearsal.yml",".github/workflows/ct15-materialize-reviewed-upgrade.yml"]), prep
          run=json.loads(api('actions/runs/'+env['REHEARSAL_RUN']))
          assert run['head_sha']==env['SOURCE_SHA'] and run['conclusion']=='success' and run['status']=='completed'
          meta=json.loads(api('actions/artifacts/'+env['ARTIFACT_ID']))
          assert meta['name']=='ct15-next16-candidate' and not meta['expired'] and meta['workflow_run']['id']==int(env['REHEARSAL_RUN'])
          archive=api('actions/artifacts/'+env['ARTIFACT_ID']+'/zip')
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist())=={'candidate.patch','result.json'}
              result=json.loads(z.read('result.json'))
              assert result['target']=='16.4.6' and result['success'] is True and len(result['steps'])==15 and all(x['ok'] for x in result['steps'])
              patch=z.read('candidate.patch')
          assert hashlib.sha256(patch).hexdigest()==env['PATCH_SHA256']
          p=pathlib.Path(env['RUNNER_TEMP'])/'reviewed.patch'
          p.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          changed=cmd('git','diff','--cached','--name-only','-z').decode().strip('\0').split('\0')
          assert len(changed)==70 and len(set(changed))==70
          allowed={'.eslintrc.json','eslint.config.mjs','next.config.js','package.json','package-lock.json','tsconfig.json'}
          assert all(x in allowed or x.startswith(('app/','components/','lib/')) for x in changed)
          manifest=json.loads(pathlib.Path('package.json').read_text())
          assert manifest['dependencies']['next']=='16.4.6' and manifest['dependencies']['react']=='19.3.1'
          lock=json.loads(pathlib.Path('package-lock.json').read_text())
          assert lock['packages']['node_modules/next']['version']=='16.4.6'
          # Use Git's exact staged blobs rather than regenerating source/lockfile.
          entries=[]
          for path in changed:
              p=pathlib.Path(path)
              if p.is_file():
                  blob=cmd('git','show',':'+path).decode('utf-8')
                  entries.append({'path':path,'mode':'100644','type':'blob','content':blob})
              else:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
          # One-shot workflow is not retained in the adopted commit.
          entries.append({'path':'.github/workflows/ct15-materialize-reviewed-upgrade.yml','mode':'100644','type':'blob','sha':None})
          tree=json.loads(api('git/trees',{'base_tree':cmd('git','rev-parse','HEAD^{tree}').decode().strip(),'tree':entries}))
          subprocess.run(['git','rm','--cached','.github/workflows/ct15-materialize-reviewed-upgrade.yml'],check=True)
          expected=cmd('git','write-tree').decode().strip()
          assert tree['sha']==expected, (tree['sha'],expected)
          commit=json.loads(api('git/commits',{'message':'CT15: adopt exact verified Next 16.4.6 and React 19 candidate','tree':tree['sha'],'parents':[head]}))
          assert commit['tree']['sha']==expected and commit['parents'][0]['sha']==head
          print('CT15_REVIEWED_COMMIT='+commit['sha'])
          print('CT15_REVIEWED_TREE='+expected)
          print('CT15_REVIEWED_PARENT='+head)
          print('No refs updated. Explicit draft-branch adoption required.')
          PY
